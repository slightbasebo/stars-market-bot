[project]
name = "stars-market-bot"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "aiogram==3.31.0",
  "aiohttp>=3.9,<3.15",
  "fragment-api-dev==1.3.0",
  "pytoniq==0.1.43",
]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
stars_market_bot = ["assets/*.png"]
